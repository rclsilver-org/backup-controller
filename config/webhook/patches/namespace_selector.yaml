apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- name: mpod-v1.kb.io
  namespaceSelector:
    matchExpressions:
      - key: "kubernetes.io/metadata.name"
        operator: NotIn
        values:
          - "kube-system"
          # "system" is the kubebuilder placeholder for the operator's own
          # namespace (never mutate the manager pod — it IS the webhook backend,
          # else the install deadlocks). The Helm chart templates this to
          # {{ .Release.Namespace }}; see
          # dist/chart/templates/webhook/mutating-webhook-configuration.yaml.
          - "system"
