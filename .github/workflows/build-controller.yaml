name: Build Controller Image

on:
  push:
    branches:
      - "**"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  lint:
    name: Code linting
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run linter
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.63.4

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Running Tests
        run: |
          go mod tidy
          make test

  # Build the controller image + the chart, and deploy them on a throwaway kind
  # cluster (with cert-manager) to prove the release is deployable. Gates the release.
  test-chart:
    name: Test chart on kind
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
    env:
      IMG: controller:latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Create kind cluster
        run: kind create cluster

      - name: Build the controller image and load it into kind
        run: |
          go mod tidy
          make docker-build
          kind load docker-image $IMG

      - name: Install Helm
        run: make install-helm

      - name: Lint the chart
        run: helm lint ./dist/chart

      - name: Install cert-manager (chart dependency)
        run: |
          helm repo add jetstack https://charts.jetstack.io
          helm repo update
          helm install cert-manager jetstack/cert-manager \
            --namespace cert-manager \
            --create-namespace \
            --set crds.enabled=true \
            --wait \
            --timeout 300s

      - name: Deploy the chart
        run: make helm-deploy

      - name: Check the release status
        run: make helm-status

  generate-version:
    name: Generate the version
    runs-on: ubuntu-latest
    needs:
      - lint
      - test

    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute the version
        id: version
        run: |
          if [ "${{ github.ref_type }}" == "tag" ]; then
            echo "value=${{ github.ref_name }}" >> ${GITHUB_OUTPUT}
          elif [ "${{ github.ref_name }}" == "master" ]; then
            version=$(git describe --tag --match 'v*.*.*' 2>/dev/null || true)

            if [ -z "${version}" ]; then
              version="$(git rev-parse --short HEAD)"
            fi

            echo "value=${version}" >> ${GITHUB_OUTPUT}
          else
            echo "value=snapshot.$(git rev-parse --short HEAD)" >> ${GITHUB_OUTPUT}
          fi

  # Release: only after lint + unit tests + the kind chart test all pass.
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    needs:
      - generate-version
      - test-chart

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: rclsilver-org/backup-controller

    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Determine image tags
        id: tags
        run: |
          if [ "${{ github.ref_type }}" == "tag" ]; then
            echo "value=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.generate-version.outputs.version }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> ${GITHUB_OUTPUT}
          else
            echo "value=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.generate-version.outputs.version }}" >> ${GITHUB_OUTPUT}
          fi

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.tags.outputs.value }}
          labels: ${{ steps.meta.outputs.labels }}

  # Publish the Helm chart (OCI), only on tags, after the image is published.
  publish-chart:
    name: Package & push chart (OCI)
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    needs:
      - generate-version
      - build

    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      # -> oci://ghcr.io/rclsilver-org/charts/backup-controller
      CHART_REPO: rclsilver-org/charts

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Stamp the chart version from the tag
        run: |
          # Chart.yaml ships version/appVersion = 0.0.0; set both to the tag so
          # version == appVersion == tag (appVersion drives the manager image tag,
          # which matches the controller image published by the build job).
          v="${{ needs.generate-version.outputs.version }}"
          sed -i \
            -e "s/^version: .*/version: ${v}/" \
            -e "s/^appVersion: .*/appVersion: \"${v}\"/" \
            dist/chart/Chart.yaml

      - name: Login to ghcr (Helm OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login "${{ env.REGISTRY }}" -u "${{ github.actor }}" --password-stdin

      - name: Package the chart
        run: helm package dist/chart

      - name: Push the chart (OCI)
        run: |
          helm push "backup-controller-${{ needs.generate-version.outputs.version }}.tgz" \
            "oci://${{ env.REGISTRY }}/${{ env.CHART_REPO }}"
